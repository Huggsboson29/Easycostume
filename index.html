<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>EasyCostume – Wizard Body AR</title>

  <!-- A-Frame renders the costume; MediaPipe Pose Landmarker (loaded below as a module) finds the body. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cam {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 0;
    }
    a-scene { position: fixed !important; inset: 0; width: 100vw !important; height: 100vh !important; z-index: 1; }
    .a-enter-vr, .a-enter-ar { display: none !important; }
    #status {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 10; max-width: 85vw; padding: 8px 14px; border-radius: 999px; text-align: center;
      font: 14px/1.3 system-ui, sans-serif; color: #fff; background: rgba(40, 20, 80, 0.75);
      pointer-events: none; transition: opacity 0.4s;
    }
  </style>

  <script>
    // Spins an entity around its local Y axis.
    AFRAME.registerComponent('spin', {
      schema: { speed: { type: 'number', default: 90 } }, // degrees per second
      tick: function (t, dt) {
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.data.speed) * (dt / 1000);
      }
    });

    // Gently pulses opacity/scale for a "magic glow" twinkle.
    AFRAME.registerComponent('twinkle', {
      schema: { speed: { type: 'number', default: 3 }, offset: { type: 'number', default: 0 } },
      tick: function (t) {
        var k = 0.5 + 0.5 * Math.sin(t / 1000 * this.data.speed + this.data.offset);
        var s = 0.6 + 0.6 * k;
        this.el.object3D.scale.set(s, s, s);
        var mesh = this.el.getObject3D('mesh');
        if (mesh && mesh.material) mesh.material.opacity = 0.4 + 0.6 * k;
      }
    });
  </script>
</head>
<body>
  <!-- Back (environment-facing) camera feed, full screen -->
  <video id="cam" playsinline muted autoplay></video>
  <div id="status">Starting back camera…</div>

  <a-scene
    embedded
    renderer="alpha: true; antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <!-- Fixed camera; costumes are placed on a plane in front of it so they line up with the video -->
    <a-entity camera="fov: 60" position="0 0 0"
              look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="0.5 1 1"></a-entity>

    <a-entity id="costumes"></a-entity>
  </a-scene>

  <!--
    One costume per person. The GLB parts are attached from JS once the model has loaded:
      body – the "Costume" mesh (robe, sleeves, beard), placed from the shoulders and mouth
      hat  – the "Hat" mesh, placed on the head; the magic ring spins around its tip
      wand – sparkles on the right wrist
    Children of .hat are in the GLB's own units (metres-ish, hat tip at 0.43).
  -->
  <template id="costume-template">
    <a-entity class="costume">
      <a-entity class="body"></a-entity>

      <a-entity class="hat">
        <!-- Magic around the hat tip: glowing orb, rotating ring, orbiting sparkles -->
        <a-entity position="-0.06 0.44 0.05" scale="0.25 0.25 0.25">
          <a-sphere radius="0.045" color="#bfe9ff"
                    material="shader: flat; transparent: true; opacity: 0.9" twinkle="speed: 5"></a-sphere>
          <a-entity rotation="70 0 10">
            <a-entity spin="speed: 120">
              <a-ring radius-inner="0.15" radius-outer="0.18" segments-theta="48" color="#9be7ff"
                      material="shader: flat; transparent: true; opacity: 0.75; side: double"></a-ring>
            </a-entity>
          </a-entity>
          <a-entity spin="speed: -160">
            <a-sphere position="0.23 0 0" radius="0.022" color="#ffffff"
                      material="shader: flat; transparent: true" twinkle="speed: 6; offset: 0"></a-sphere>
            <a-sphere position="-0.12 0.05 0.2" radius="0.018" color="#ffe680"
                      material="shader: flat; transparent: true" twinkle="speed: 7; offset: 2"></a-sphere>
            <a-sphere position="-0.12 -0.04 -0.2" radius="0.018" color="#d9a8ff"
                      material="shader: flat; transparent: true" twinkle="speed: 5; offset: 4"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Wand sparkles on the right wrist (1 unit = head width) -->
      <a-entity class="wand">
        <a-sphere radius="0.08" color="#bfe9ff" material="shader: flat; transparent: true" twinkle="speed: 6"></a-sphere>
        <a-entity spin="speed: 200">
          <a-sphere position="0.18 0 0" radius="0.03" color="#ffe680" material="shader: flat; transparent: true" twinkle="speed: 8"></a-sphere>
          <a-sphere position="-0.18 0.04 0" radius="0.025" color="#d9a8ff" material="shader: flat; transparent: true" twinkle="speed: 7; offset: 3"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>
  </template>

  <script type="module">
    import { FilesetResolver, PoseLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

    const MAX_PEOPLE = 3;
    const SMOOTHING = 0.5;   // 0 = frozen, 1 = raw (jittery) landmarks
    const DEPTH = 5;         // distance of the costume plane from the camera
    const FOV = 60;          // must match the camera fov in the scene

    // Reference points measured on wizard_costume.glb (model units, figure faces +Z).
    const MODEL = {
      SHOULDER_Y: 0.16, SHOULDER_W: 0.26,   // shoulder joints on the robe
      MOUTH_Y: 0.25,                        // just under the moustache
      FACE_CUT_Y: 0.262,                    // robe/hood geometry above this is removed so the real face shows
      HAT_CUT_Y: 0.272,                     // hair/hood under the hat brim is removed for the same reason
      BRIM_X: -0.008, BRIM_Y: 0.285,        // centre of the hat brim
      BRIM_W: 0.21                          // hat brim width
    };

    const video = document.getElementById('cam');
    const status = document.getElementById('status');
    const scene = document.querySelector('a-scene');

    // MediaPipe pose landmark indices
    const L = { NOSE: 0, L_EAR: 7, R_EAR: 8, MOUTH_L: 9, MOUTH_R: 10,
                L_SHOULDER: 11, R_SHOULDER: 12, R_WRIST: 16 };

    function say(text) { status.textContent = text; status.style.opacity = text ? '1' : '0'; }

    // ---------- Back camera only ----------
    async function startCamera() {
      const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...size, facingMode: { exact: 'environment' } } });
      } catch (e) {
        if (e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError') throw e;
        // No camera labelled as rear-facing (e.g. a laptop): fall back to whatever camera exists.
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...size, facingMode: 'environment' } });
      }
      video.srcObject = stream;
      await video.play();
    }

    // ---------- Pose model ----------
    async function createLandmarker() {
      const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const options = (delegate) => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate
        },
        runningMode: 'VIDEO',
        numPoses: MAX_PEOPLE
      });
      try { return await PoseLandmarker.createFromOptions(fileset, options('GPU')); }
      catch (e) { return await PoseLandmarker.createFromOptions(fileset, options('CPU')); }
    }

    // ---------- Costume model ----------
    // Keep only triangles with at least one vertex on the wanted side of y = cutY.
    function cut(mesh, cutY, keepAbove) {
      const g = mesh.geometry;
      const y = g.attributes.position;
      const src = g.index ? g.index.array : [...Array(y.count).keys()];
      const keep = [];
      for (let i = 0; i < src.length; i += 3) {
        const a = src[i], b = src[i + 1], c = src[i + 2];
        const ok = (v) => keepAbove ? y.getY(v) >= cutY : y.getY(v) <= cutY;
        if (ok(a) || ok(b) || ok(c)) keep.push(a, b, c);
      }
      g.setIndex(keep);
    }

    async function loadCostume() {
      const gltf = await new Promise((resolve, reject) =>
        new THREE.GLTFLoader().load('wizard_costume.glb', resolve, undefined, reject));
      const body = gltf.scene.getObjectByName('Costume');
      const hat = gltf.scene.getObjectByName('Hat');
      body.traverse((o) => { if (o.isMesh) cut(o, MODEL.FACE_CUT_Y, false); });
      hat.traverse((o) => { if (o.isMesh) cut(o, MODEL.HAT_CUT_Y, true); });
      // Clones share geometry and textures, so extra people cost almost nothing.
      for (const s of slots) {
        s.part('body').setObject3D('mesh', body.clone());
        s.part('hat').setObject3D('mesh', hat.clone());
      }
    }

    // ---------- Costume entities, one per person ----------
    const tpl = document.getElementById('costume-template');
    const container = document.getElementById('costumes');
    const slots = [];
    for (let i = 0; i < MAX_PEOPLE; i++) {
      container.appendChild(tpl.content.cloneNode(true));
      const root = container.lastElementChild;
      slots.push({ root, smooth: null, part: (c) => root.querySelector('.' + c) });
    }

    // ---------- Normalised video coords → world coords on the costume plane ----------
    // The video is shown with object-fit: cover, so account for the cropped edges.
    function makeMapper() {
      const W = window.innerWidth, H = window.innerHeight;
      const vw = video.videoWidth, vh = video.videoHeight;
      const s = Math.max(W / vw, H / vh);
      const dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
      const halfH = DEPTH * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
      const halfW = halfH * (W / H);
      return (p) => ({
        x: ((ox + p.x * dw) / W * 2 - 1) * halfW,
        y: (1 - (oy + p.y * dh) / H * 2) * halfH
      });
    }

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function place(el, x, y, z, roll, sx, sy = sx, sz = sx) {
      const o = el.object3D;
      o.position.set(x, y, z);
      o.rotation.set(0, 0, roll);
      o.scale.set(sx, sy, sz);
    }

    // Rotate a model-space offset by roll and scale it, giving the world-space offset.
    function offset(mx, my, roll, sx, sy) {
      const x = mx * sx, y = my * sy, c = Math.cos(roll), s = Math.sin(roll);
      return { x: x * c - y * s, y: x * s + y * c };
    }

    function dress(slot, lm) {
      const toWorld = makeMapper();
      const P = (i) => toWorld(lm[i]);
      const vis = (i) => (lm[i].visibility ?? 1) > 0.5;
      const z = -DEPTH;

      const lEar = P(L.L_EAR), rEar = P(L.R_EAR);
      const lSh = P(L.L_SHOULDER), rSh = P(L.R_SHOULDER);
      const shoulderW = dist(lSh, rSh);
      const headW = Math.max(dist(lEar, rEar) * 1.15, shoulderW * 0.45);

      // Tilt from the ear / shoulder lines (the person's left side shows on the right of a back-camera image).
      const headRoll = Math.atan2(lEar.y - rEar.y, lEar.x - rEar.x);
      const bodyRoll = Math.atan2(lSh.y - rSh.y, lSh.x - rSh.x);
      const head = mid(lEar, rEar);
      const neck = mid(lSh, rSh);
      const mouth = mid(P(L.MOUTH_L), P(L.MOUTH_R));

      // Robe: width from the shoulders; height stretched so the beard lands on the chin.
      const sx = shoulderW / MODEL.SHOULDER_W;
      const mouthAbove = (mouth.x - neck.x) * -Math.sin(bodyRoll) + (mouth.y - neck.y) * Math.cos(bodyRoll);
      const sy = Math.min(Math.max(mouthAbove / (MODEL.MOUTH_Y - MODEL.SHOULDER_Y), sx * 0.9), sx * 1.25);
      const b = offset(0, MODEL.SHOULDER_Y, bodyRoll, sx, sy);
      const body = slot.part('body');
      body.object3D.visible = vis(L.L_SHOULDER) && vis(L.R_SHOULDER);
      place(body, neck.x - b.x, neck.y - b.y, z, bodyRoll, sx, sy, sx);

      // Hat: brim a little wider than the head, sitting on the forehead line.
      const sh = headW * 1.3 / MODEL.BRIM_W;
      const up = { x: -Math.sin(headRoll), y: Math.cos(headRoll) };
      const h = offset(MODEL.BRIM_X, MODEL.BRIM_Y, headRoll, sh, sh);
      place(slot.part('hat'), head.x + up.x * headW * 0.3 - h.x, head.y + up.y * headW * 0.3 - h.y, z, headRoll, sh);

      // Wand sparkles on the right wrist.
      const wand = slot.part('wand');
      wand.object3D.visible = vis(L.R_WRIST);
      const wrist = P(L.R_WRIST);
      place(wand, wrist.x, wrist.y, z + headW, 0, headW);
    }

    // Keep each person on the same costume between frames (nearest nose) and smooth their landmarks.
    function update(poses) {
      const used = new Set();
      for (const lm of poses) {
        let best = null, bestD = Infinity;
        for (const s of slots) {
          if (used.has(s)) continue;
          const d = s.smooth ? dist(s.smooth[L.NOSE], lm[L.NOSE]) : 10;
          if (d < bestD) { bestD = d; best = s; }
        }
        used.add(best);
        if (!best.smooth || bestD > 0.25) {
          best.smooth = lm.map((p) => ({ ...p }));
        } else {
          best.smooth.forEach((p, i) => {
            p.x += (lm[i].x - p.x) * SMOOTHING;
            p.y += (lm[i].y - p.y) * SMOOTHING;
            p.visibility = lm[i].visibility;
          });
        }
      }
      for (const s of slots) {
        s.root.object3D.visible = used.has(s);
        if (used.has(s)) dress(s, s.smooth);
        else s.smooth = null;
      }
      return used.size;
    }

    async function main() {
      slots.forEach((s) => { s.root.object3D.visible = false; });
      if (!window.isSecureContext) { say('Open this page over HTTPS (or localhost) to use the camera.'); return; }
      try {
        await startCamera();
      } catch (e) {
        say('Back camera unavailable (' + (e.message || e.name) + '). Check camera permission and reload.');
        return;
      }
      say('Loading costume and body tracking…');
      let landmarker;
      try { [landmarker] = await Promise.all([createLandmarker(), loadCostume()]); }
      catch (e) { say('Could not load: ' + (e.message || e)); return; }
      say('Point the camera at a person 🧙');

      let lastVideoTime = -1;
      (function loop() {
        if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, performance.now());
          say(update(result.landmarks || []) ? '' : 'Point the camera at a person 🧙');
        }
        requestAnimationFrame(loop);
      })();
    }

    if (scene.hasLoaded) main();
    else scene.addEventListener('loaded', main, { once: true });
  </script>
</body>
</html>
