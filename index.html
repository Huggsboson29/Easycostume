<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>EasyCostume – Wizard Face AR</title>

  <!-- A-Frame + MindAR face tracking (versions pinned; MindAR 1.2.5 is built against A-Frame 1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    /* Only <html> gets a background: MindAR puts the camera <video> at a negative z-index,
       and a body background would paint over it (that caused a black screen). */
    html { background: #000; }
    body { background: transparent; }
    /* MindAR injects the <video> feed; force it (and the scene) to cover the screen */
    video { object-fit: cover; }
    .a-enter-vr, .a-enter-ar { display: none !important; }
    #hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 10; padding: 8px 14px; border-radius: 999px;
      font: 14px/1.3 system-ui, sans-serif; color: #fff; background: rgba(40, 20, 80, 0.7);
      pointer-events: none; transition: opacity 0.4s;
    }
    #switch-cam {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      padding: 10px 14px; border: 0; border-radius: 999px;
      font: 14px system-ui, sans-serif; color: #fff; background: rgba(40, 20, 80, 0.7);
    }
  </style>

  <script>
    // Spins an entity around its local Y axis.
    AFRAME.registerComponent('spin', {
      schema: { speed: { type: 'number', default: 90 } }, // degrees per second
      tick: function (t, dt) {
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.data.speed) * (dt / 1000);
      }
    });

    // Gently pulses opacity/scale for a "magic glow" twinkle.
    AFRAME.registerComponent('twinkle', {
      schema: { speed: { type: 'number', default: 3 }, offset: { type: 'number', default: 0 } },
      tick: function (t) {
        var k = 0.5 + 0.5 * Math.sin(t / 1000 * this.data.speed + this.data.offset);
        var s = 0.6 + 0.6 * k;
        this.el.object3D.scale.set(s, s, s);
        var mesh = this.el.getObject3D('mesh');
        if (mesh && mesh.material) mesh.material.opacity = 0.4 + 0.6 * k;
      }
    });
  </script>
</head>
<body>
  <div id="hint">Point the camera at a face to make a wizard ✨</div>
  <button id="switch-cam" type="button">Switch camera</button>

  <!--
    mindar-face starts the camera (back by default, ?cam=front for selfie) and tracks 468 face landmarks.
    Units: roughly 1 unit ≈ face width, origin at each anchor landmark.
  -->
  <a-scene
    mindar-face="autoStart: true; uiLoading: yes; uiError: yes; uiScanning: no; shouldFaceUser: false"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 1.2" position="0.5 1 1"></a-entity>

    <!-- Invisible head occluder so the back of the hat brim hides behind the head -->
    <a-entity mindar-face-default-face-occluder></a-entity>

    <!-- ===== WIZARD HAT: anchored to the top of the forehead (landmark 10) ===== -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <!-- Tilt the hat back a touch so it sits on the crown, not the brow -->
      <a-entity position="0 0.15 -0.35" rotation="-12 0 0">
        <!-- Brim: wide flat cylinder -->
        <a-cylinder radius="0.95" height="0.04"
                    color="#3b1f7a" material="roughness: 0.8"></a-cylinder>
        <!-- Gold band just above the brim -->
        <a-cylinder position="0 0.08 0" radius="0.56" height="0.12" open-ended="true"
                    color="#f2c14e" material="metalness: 0.6; roughness: 0.3; side: double"></a-cylinder>
        <!-- Pointy crown -->
        <a-cone position="0 0.75 0" height="1.5" radius-bottom="0.55" radius-top="0.02"
                color="#4a2bb3" material="roughness: 0.7"></a-cone>
        <!-- Floppy tip: small bent cone near the top -->
        <a-cone position="0.08 1.55 -0.03" rotation="0 0 -35" height="0.3"
                radius-bottom="0.07" radius-top="0.005" color="#4a2bb3"></a-cone>

        <!-- Stars on the hat -->
        <a-entity position="0.18 0.55 0.42" rotation="0 20 0">
          <a-circle radius="0.06" segments="5" color="#ffe680"
                    material="shader: flat; side: double"></a-circle>
        </a-entity>
        <a-entity position="-0.15 0.95 0.26" rotation="0 -20 0">
          <a-circle radius="0.045" segments="5" color="#ffe680"
                    material="shader: flat; side: double"></a-circle>
        </a-entity>

        <!-- ===== MAGIC around the hat tip ===== -->
        <a-entity position="0.18 1.66 -0.03">
          <!-- Glowing tip orb -->
          <a-sphere radius="0.05" color="#bfe9ff"
                    material="shader: flat; transparent: true; opacity: 0.9"
                    twinkle="speed: 5"></a-sphere>

          <!-- Rotating glow ring, tilted like a halo -->
          <a-entity rotation="70 0 10">
            <a-entity spin="speed: 120">
              <a-ring radius-inner="0.17" radius-outer="0.2" segments-theta="48"
                      color="#9be7ff"
                      material="shader: flat; transparent: true; opacity: 0.75; side: double"></a-ring>
            </a-entity>
          </a-entity>

          <!-- Orbiting sparkles -->
          <a-entity spin="speed: -160">
            <a-sphere position="0.26 0 0" radius="0.025" color="#ffffff"
                      material="shader: flat; transparent: true" twinkle="speed: 6; offset: 0"></a-sphere>
            <a-sphere position="-0.13 0.05 0.22" radius="0.02" color="#ffe680"
                      material="shader: flat; transparent: true" twinkle="speed: 7; offset: 2"></a-sphere>
            <a-sphere position="-0.13 -0.04 -0.22" radius="0.02" color="#d9a8ff"
                      material="shader: flat; transparent: true" twinkle="speed: 5; offset: 4"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ===== WIZARD BEARD: anchored to the chin (landmark 152) ===== -->
    <a-entity mindar-face-target="anchorIndex: 152">
      <!-- Main beard: soft white cone hanging point-down, curved slightly forward -->
      <a-entity position="0 0.12 -0.12" rotation="12 0 0">
        <a-cone position="0 -0.5 0" rotation="180 0 0"
                height="1.1" radius-bottom="0.45" radius-top="0.03" segments-radial="24"
                color="#f7f7f2" material="roughness: 1"></a-cone>
        <!-- Fluffy cheek tufts so it blends up to the jawline -->
        <a-sphere position="-0.3 0.02 0.02" radius="0.22" scale="1 0.8 0.7"
                  color="#f7f7f2" material="roughness: 1"></a-sphere>
        <a-sphere position="0.3 0.02 0.02" radius="0.22" scale="1 0.8 0.7"
                  color="#f7f7f2" material="roughness: 1"></a-sphere>
        <a-sphere position="0 0 0.08" radius="0.3" scale="1.2 0.7 0.6"
                  color="#f7f7f2" material="roughness: 1"></a-sphere>
        <!-- Curled tip -->
        <a-torus position="0.04 -1.05 0.02" rotation="0 90 0"
                 radius="0.05" radius-tubular="0.02" arc="270"
                 color="#f7f7f2"></a-torus>
      </a-entity>
    </a-entity>

    <!-- Moustache: also tied to the upper lip (landmark 164 – just below the nose) -->
    <a-entity mindar-face-target="anchorIndex: 164">
      <a-entity position="0 -0.02 0.04">
        <a-cone position="-0.17 -0.04 0" rotation="0 0 -110" height="0.34"
                radius-bottom="0.07" radius-top="0.01" color="#f7f7f2"></a-cone>
        <a-cone position="0.17 -0.04 0" rotation="0 0 110" height="0.34"
                radius-bottom="0.07" radius-top="0.01" color="#f7f7f2"></a-cone>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Camera choice: back (environment) camera by default, ?cam=front for the selfie camera.
    // This runs before A-Frame initialises the scene (it waits for DOMContentLoaded),
    // so the attribute change is picked up when MindAR starts.
    var useFront = new URLSearchParams(location.search).get('cam') === 'front';
    document.querySelector('a-scene').setAttribute('mindar-face',
      'autoStart: true; uiLoading: yes; uiError: yes; uiScanning: no; shouldFaceUser: ' + useFront);
    document.getElementById('switch-cam').addEventListener('click', function () {
      var url = new URL(location.href);
      url.searchParams.set('cam', useFront ? 'back' : 'front');
      location.replace(url);
    });

    // Make the embedded scene fill the viewport and hide the hint once a face is found.
    var scene = document.querySelector('a-scene');
    var hint = document.getElementById('hint');
    scene.style.position = 'fixed';
    scene.style.inset = '0';
    scene.style.width = '100vw';
    scene.style.height = '100vh';

    document.querySelectorAll('[mindar-face-target]').forEach(function (el) {
      el.addEventListener('targetFound', function () { hint.style.opacity = '0'; });
      el.addEventListener('targetLost', function () { hint.style.opacity = '1'; });
    });
  </script>
</body>
</html>
